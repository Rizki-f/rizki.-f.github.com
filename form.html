<!DOCTYPE html>
<html lang="">
<head>
    <title>Form Pembelian</title>
<body>
<form>
    <table border="1" bgcolor="#fff" align="center" height="500" width="400" cellpadding="20">
        <tr>
            <td>
                <b><font color="blue" size="10">Pembayaran</font></b>
                <p><b>Bayar Disni yaa :)</b></p>
                <input type="text" name="nama" size="20" placeholder="Nama Depan">
                <input type="text" name="nama" size="20" placeholder="Nama Belakang">
                <br><br>
                <input type="text" name="email" size="46" placeholder="Email Anda">
                <br><br>
                <input type="text" name="reemail" size="46" placeholder="Masukkan Ulang Email Anda">
                <br><br>
                <input type="password" name="password" size="46" placeholder="Masukan No Pin Anda!!">
                <p><b>Tanggal Pembelian</b></p>
                <input type="date" name="date">
                <br><br>
                <label>Jenis Kelamin :</label>
                <input type="radio" name="jeniskelamin" value="L">Laki-laki
                <input type="radio" name="jeniskelamin" value="P">Perempuan
                <br><br>
                <label>Jenis Pembayaran :</label>
                <input type="radio" name="MetodePembayaran" value="Q">Qris
                <input type="radio" name="MetodePembayaran" value="T">Transfer
                <input type="radio" name="MetodePembayaran" value="C">Cash
                <br><br>
                <b><center><button><font color="Red" size="5">BAYAR!!</button</center></font></b>
        <tr><td>
    </form>       
</body>
</html>
